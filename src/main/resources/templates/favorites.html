<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Favorites</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">


    <div class="row">
        <div th:replace="~{fragments/header}"></div>
        <div th:each="movie : ${favorites}" class="col-md-3 mb-3">
            <div class="card h-100">
                <img th:if="${movie.posterPath != null}"
                     th:src="'https://image.tmdb.org/t/p/w300' + ${movie.posterPath}"
                     class="card-img-top" alt="Movie Poster">
                <div class="card-body">
                    <h5 th:text="${movie.title}">Movie Title</h5>
                    <p class="card-text" th:text="${#strings.abbreviate(movie.overview, 100)}">Description...</p>
                    <a th:href="@{/movie/{id}(id=${movie.id})}" class="btn btn-primary">View Details</a>
                    <form th:if="${isFavorite}" th:action="@{/favorites/remove/{id}(id=${movie.id})}" method="post">
                        <button type="submit" class="btn btn-danger">
                            <i class="fas fa-trash-alt"></i> Remove from Favorites
                        </button>
                    </form>
                </div>
            </div>
        </div>
        <div th:replace="~{fragments/footer}"></div>

    </div>
</div>
</body>
</html>
