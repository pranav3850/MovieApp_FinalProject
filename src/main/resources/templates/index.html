<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Movie Catalogue</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">

    <div class="row">
        <div th:replace="~{fragments/header}"></div>

        <div class="container my-5">
            <div class="row">
                <div th:each="movie : ${movies}" class="col-lg-3 col-md-4 col-sm-6 mb-4">
                    <div class="movie-card">
                        <img th:src="${movie.posterPath != null} ?
                    'https://image.tmdb.org/t/p/w500' + ${movie.posterPath} :
                    '/images/no-image.jpg'"
                             class="movie-poster" alt="Movie poster">
                        <div class="movie-body">
                            <h5 class="movie-title" th:text="${movie.title}"></h5>
                            <p class="movie-overview" th:text="${#strings.abbreviate(movie.overview, 100)}"></p>
                            <a th:href="@{/movie/{id}(id=${movie.id})}"
                               class="btn btn-details">View Details</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:replace="~{fragments/footer}"></div>
    </div>
</div>
</body>
</html>
